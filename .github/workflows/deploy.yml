name: Build & Deploy to Hostinger

# Despliegue ROVELBOTS: cada push a `main` compila el sitio
# y sube el contenido de `dist/` al `public_html` de Hostinger por FTPS.
#
# Secrets requeridos en GitHub (Settings → Secrets → Actions):
#   FTP_HOST        → servidor FTP (hPanel → Hosting → Cuentas FTP → Host)
#   FTP_USERNAME    → usuario de la cuenta FTP
#   FTP_PASSWORD    → contraseña de la cuenta FTP
#   FTP_SERVER_DIR  → ruta destino, ej: public_html/
#                    o domains/tudominio.com/public_html/ (addon/subdominio)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy dist/ to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
